<!DOCTYPE html>
<html>
<head>
    <title>Sky Healthcare Admin</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Sky Healthcare - Booking Admin</h1>
<div class="dashboard">

<div class="card">
<h2 id="totalBookings">0</h2>
<p>Total Bookings</p>
</div>

<div class="card">
<h2 id="todayBookings">0</h2>
<p>Today Bookings</p>
</div>

<div class="card">
<h2 id="nursingCount">0</h2>
<p>Home Nursing</p>
</div>

<div class="card">
<h2 id="caretakerCount">0</h2>
<p>Caretaker</p>
</div>

</div>
<table border="1">
    <thead>
        <tr>
    <th>Name</th>
    <th>Mobile</th>
    <th>Service</th>
    <th>Address</th>
    <th>Status</th>
    <th>Date</th>
        </tr>
    </thead>

    <tbody id="bookingList">
        
    </tbody>
</table>


<script type="module" src="admin.js"></script>

</body>
</html>
